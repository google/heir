# Bazel downloader rewrite config (--experimental_downloader_config).
#
# pocketfft (a BCR dep) is hosted only on gitlab.mpcdf.mpg.de, which is
# frequently unreachable and times out cold fetches. Transparently redirect
# that one download to the GitHub mirror, whose git-archive tarball is
# byte-identical (same sha256), so the BCR integrity check still passes.
rewrite gitlab\.mpcdf\.mpg\.de/mtr/pocketfft/-/archive/([0-9a-f]+)/pocketfft-.*\.tar\.gz github.com/mreineck/pocketfft/archive/$1.tar.gz
