name: First Interaction Welcome

# Stage 2 of 2 of the first-time contributor welcome flow.
#
# Triggered when first_interaction_trigger.yml (stage 1) completes. A
# `workflow_run` workflow always runs the version of this file on the default
# branch, so it can safely be given write permissions even for PRs from forks.
#
# The decision logic lives in scripts/first_interaction.py (see
# scripts/test_first_interaction.py for tests). The checkout below uses the
# default `ref` for `workflow_run`, i.e., the latest commit on the default
# branch, so code from the PR is never checked out or executed. PR-controlled
# values are passed via environment variables, never interpolated into `run`.

on:
  workflow_run:
    workflows: ["First Interaction Trigger"]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out script from the default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/first_interaction.py
          sparse-checkout-cone-mode: false

      - name: Welcome first-time contributor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 scripts/first_interaction.py \
            --repo="${REPO}" \
            --default-branch="${DEFAULT_BRANCH}" \
            --head-owner="${HEAD_OWNER}" \
            --head-branch="${HEAD_BRANCH}" \
            --head-sha="${HEAD_SHA}"
