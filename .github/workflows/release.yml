name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v2026.04.01). If it does not exist, it will be created at the end. Leave empty for dev build.'
        # Note: We do NOT pass this tag to actions/checkout. We checkout the
        # branch selected in the UI (usually main), and this tag is created at
        # the end of the workflow by the release step if it didn't exist.
        required: false
        default: ''
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels
    uses: ./.github/workflows/_build_wheels.yml
    with:
      tag_name: ${{ inputs.tag_name }}

  create_archive:
    name: Create source archive
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Archive
        id: archive
        env:
          VERSION: ${{ needs.build-wheels.outputs.version }}
        run: |
          TAG_NAME="$VERSION"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi
          git archive --format=tar.gz --prefix="heir-$TAG_NAME/" -o "heir-$TAG_NAME.tar.gz" HEAD
          sha256sum "heir-$TAG_NAME.tar.gz" > "heir-$TAG_NAME.tar.gz.sha256"
          echo "archive_file=heir-$TAG_NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum_file=heir-$TAG_NAME.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: heir-*.tar.gz*

  perform_release:
    name: Create GitHub Release and Upload Assets
    needs: [build-wheels, create_archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: archive
          name: source-archive

      # The standalone heir-opt and heir-translate binaries (which aren't part
      # of the wheels), named after the wheels' platform tags. See
      # _build_wheels.yml.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: extracted
          pattern: binaries-*
          merge-multiple: true

      - name: List binaries
        shell: bash
        run: ls -alh extracted/

      - name: Determine Tag Name
        id: tag
        shell: bash
        env:
          VERSION: ${{ needs.build-wheels.outputs.version }}
        run: |
          TAG_NAME="$VERSION"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
          files: |
            archive/*
            extracted/*

  pypi_upload:
    name: Publish heir wheels to PyPI
    needs: [build-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          verbose: true
