name: Build and Test (Linux)
permissions: read-all
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on:
      labels: ubuntu-24.04
    env:
      BUILDBUDDY_API_KEY: ${{ github.repository == 'google/heir' && secrets.BUILDBUDDY_API_KEY || 'SEVzwPt2S7PHhY1OxD3u' }}
      BAZEL_CONFIG_FLAG: ${{ github.repository == 'google/heir' && '--config=ci --config=remote' || '--config=ci' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      # Bazel tests
      - name: "Run `bazel build`"
        run: |
          read -r -a BAZEL_CONFIGS <<< "$BAZEL_CONFIG_FLAG"
          bazel build -c opt "${BAZEL_CONFIGS[@]}" \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --build_metadata=ROLE=CI_BUILD_AND_TEST_BUILD \
            //...

      - name: "Run `bazel test`"
        run: |
          read -r -a BAZEL_CONFIGS <<< "$BAZEL_CONFIG_FLAG"
          bazel test -c opt "${BAZEL_CONFIGS[@]}" \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --build_metadata=ROLE=CI_BUILD_AND_TEST_TEST \
            //...
