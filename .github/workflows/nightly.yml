name: Nightly release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  setup-version:
    name: Setup version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Get version
        id: get-version
        run: echo "version=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

  build_wheels:
    name: Build HEIR wheels on ${{ matrix.name }}
    needs: [setup-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15

    steps:
      - name: Check out HEIR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        name: Install Python 3.12
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip uv

      - name: Build wheels on ${{ matrix.name }} using cibuildwheel
        uses: pypa/cibuildwheel@5f22145df44122af0f5a201f93cf0207171beca7 # v3.0.0
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.setup-version.outputs.version }}
          # Also build the standalone heir-opt and heir-translate (which aren't
          # part of the wheel) for the GitHub release into binaries/ (see
          # setup.py). cibuildwheel mounts the host filesystem at /host in the
          # Linux build container.
          HEIR_STANDALONE_BINARIES_DIR: ${{ runner.os == 'Linux' && format('/host{0}/binaries', github.workspace) || format('{0}/binaries', github.workspace) }}
          CIBW_ENVIRONMENT_PASS: SETUPTOOLS_SCM_PRETEND_VERSION HEIR_STANDALONE_BINARIES_DIR

      - name: Upload HEIR ${{ matrix.name }} wheels
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.name }}
          path: wheelhouse/*.whl

      - name: Name the standalone binaries after the wheel's platform tag
        shell: bash
        run: |
          # Wheels are named distribution-version-python_tag-abi_tag-platform_tag.whl
          wheels=(wheelhouse/*.whl)
          platform=$(basename "${wheels[0]}" | rev | cut -d- -f1 | rev | cut -d. -f1)
          mkdir -p release-binaries
          cp binaries/heir-opt "release-binaries/heir-opt-$platform"
          cp binaries/heir-translate "release-binaries/heir-translate-$platform"
          ls -alh release-binaries/

      - name: Upload HEIR ${{ matrix.name }} standalone binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.name }}
          path: release-binaries/*

  create_archive:
    name: Create source archive
    needs: [setup-version]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Archive
        id: archive
        env:
          VERSION: ${{ needs.setup-version.outputs.version }}
        run: |
          TAG_NAME="$VERSION"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v$TAG_NAME"
          fi
          git archive --format=tar.gz --prefix="heir-$TAG_NAME/" -o "heir-$TAG_NAME.tar.gz" HEAD
          sha256sum "heir-$TAG_NAME.tar.gz" > "heir-$TAG_NAME.tar.gz.sha256"
          echo "archive_file=heir-$TAG_NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum_file=heir-$TAG_NAME.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: heir-*.tar.gz*

  perform_release:
    name: Create GitHub Release and Upload Assets
    needs: [setup-version, build_wheels, create_archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: archive
          name: source-archive

      # The standalone heir-opt and heir-translate binaries (which aren't part
      # of the wheels), named after the wheels' platform tags.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: extracted
          pattern: binaries-*
          merge-multiple: true

      - name: List binaries
        shell: bash
        run: ls -alh extracted/

      - name: Create Dated Release
        id: dated_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          tag_name: nightly-${{ needs.setup-version.outputs.version }}
          name: Nightly ${{ needs.setup-version.outputs.version }}
          prerelease: true
          files: |
            archive/*
            extracted/*

      - name: Delete previous existing nightly tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
            gh release view "nightly" --repo ${{ github.repository }} && gh release delete "nightly" -y --cleanup-tag --repo ${{ github.repository }} || true

      - name: Create Rolling Nightly Release
        id: rolling_release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: |
            archive/*
            extracted/*

      - name: Cleanup old nightly releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release list --limit 100 --repo ${{ github.repository }} | grep "nightly-" | while read -r line; do
            tag=$(echo "$line" | awk '{print $1}')
            date_str=${tag#nightly-}
            if [[ $date_str =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
              formatted_date=${date_str//./-}
              release_date=$(date -d "$formatted_date" +%s)
              limit_date=$(date -d "90 days ago" +%s)
              if [ "$release_date" -lt "$limit_date" ]; then
                echo "Deleting old release $tag"
                gh release delete "$tag" -y --cleanup-tag --repo ${{ github.repository }}
              fi
            fi
          done
