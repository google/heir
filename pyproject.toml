[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "heir_py"
dynamic = ["version"]
authors = [
  { name = "Jeremy Kun", email = "jkun@google.com" },
  { name = "Asra Ali", email = "asraa@google.com" },
  { name = "Alexander Viand", email = "alexander.viand@intel.com" },
]
description = "The HEIR compiler"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
]
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]
# The package ships HEIR's python bindings (with native extensions) and the
# heir-opt/heir-translate binaries, and has no python dependencies.
dependencies = []

[project.optional-dependencies]
# dev dependencies
dev = [
  "absl-py>=2.1.0",
  # for tests/Examples that run ML models
  "numpy>=1.23.5,<2",
  # for tests/poly/runner/generate_test_cases.py
  "tomli>=2.0.1",
  "sympy>=1.12",
  "mpmath>=1.3.0",
  # Requirements for running jaxite backend examples
  "jaxite==0.0.2",
  # for scripts and repo utils
  "fire>=0.7.0",
  "jinja2>=3.1.5",
  "pre-commit>=v3.3.3",
  "requests>=2.0.0",
  # Python Formatting
  "pyink>=24.10.1",
  # For ML integration tests
  "torch>=2.8.0",
  "setuptools>=80.9.0",
  "cibuildwheel>=4.0.0",
  "pytest",
  "pytest-xdist",
]

# For `uv sync` (which includes `dev` by default) or / `pip install --group dev`.
# Not visible to pip-compile, so requirements.txt is generated with explicit --extra flags.
# Note `uv sync` installs the project in editable mode, which runs a bazel build
# (see setup.py); use `uv sync --no-install-project` to only install the deps.
[dependency-groups]
dev = ["heir_py[dev]"]

[project.urls]
Homepage = "https://heir.dev"
Issues = "https://github.com/google/heir/issues"

[project.scripts]
heir-opt = "heir.entrypoints:run_heir_opt"
heir-translate = "heir.entrypoints:run_heir_translate"

[tool.setuptools]
package-dir = { "" = "python" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["python"]
include = ["heir*"]

[tool.cibuildwheel]
# The wheel uses CPython's stable ABI (abi3) for the oldest supported version
# (see MIN_PYTHON in setup.py). cibuildwheel builds it once, for cp312, and
# reuses it for each later version, where it only runs the tests (and, by
# default, `abi3audit`).
build = "cp312-* cp313-* cp314-*"
build-frontend = "build[uv]"
skip = "*musllinux* *android* *ios* *pyodide*"
# cibuildwheel runs this from an isolated directory, so `import heir` resolves
# to the installed wheel rather than the source tree.
test-command = "python {package}/python/test/heir_test.py"

[tool.cibuildwheel.linux]
archs = "auto64"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash .github/install_cibuildwheel_deps.sh"
# Use the rootless Bazel installation inside the container.
environment = { PATH = "$PATH:$HOME/bin" }
# Force the repaired wheel to use the manylinux_2_28 platform tag.
# By default, auditwheel may analyze the wheel's actual symbol requirements
# and choose or add a lower compatible manylinux_x_y tag such as 2_28
# which PyPi might reject (they only accept a few specific tags).
repair-wheel-command = "auditwheel repair --plat manylinux_2_28_$(uname -m) --only-plat -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
archs = "auto64"

[tool.cibuildwheel.macos]
# Inherits archs from default (auto64)
# Unused by Bazel, but needed explicitly by delocate on MacOS.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.pytest.ini_options]
norecursedirs = [
  ".git",
  "__pycache__",
  "bazel",
  "bazel-bin",
  "bazel-heir",
  "bazel-out",
  "bazel-testlogs",
  "docs",
  "external",
  "tests",
  "tools",
  "venv",
]

[tool.pyink]
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.codespell]
# words to allow even though codespell thinks they're misspelled
ignore-words-list = "crate,fpt,LogArithmetic,olt,allOne,inH"
# enable if you want the pre-commit hook to automatically write changes
write-changes = false
# files to exclude
skip = "*.lock"

[tool.setuptools_scm]
# Can be empty, setuptools-scm handles the rest by default.
